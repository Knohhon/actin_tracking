[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actin-tracking"
version = "0.1.0"
description = "Reproducible actin filament tracking benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ijson==3.3.0",
    "numpy==2.2.6",
    "pillow==11.2.1",
    "pycocotools==2.0.8",
]

[project.scripts]
actin = "actin_tracking.cli:main"

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13", "mypy==1.15.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
